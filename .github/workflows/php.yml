name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMPOSER_NO_AUDIT: "1"
    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        extensions: intl, zip, pdo, pdo_mysql, pdo_pgsql, mbstring, xml, gd, exif
        coverage: none

    - name: Validate composer.json
      run: composer validate --no-check-publish --no-check-lock --no-check-all

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v4
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer update --prefer-dist --no-progress --no-scripts --no-interaction

    - name: Upload composer.lock
      uses: actions/upload-artifact@v4
      with:
        name: composer-lock
        path: composer.lock
        retention-days: 7
